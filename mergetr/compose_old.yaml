services:
  vault:
    image: hashicorp/vault:1.15
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://vault:8200
    ports:
      - "8200:8200"
    volumes:
      - ./scripts/init-vault.sh:/init-vault.sh
    command: vault server -dev -dev-root-token-id=myroot
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:${POSTGRES_VERSION:-14}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DB:-db_transcendence}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: myroot
    volumes:
      - ./scripts/init-vault.sh:/init-vault.sh
    command: ["/bin/sh", "/init-vault.sh"]
    profiles:
      - init

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      HTTP_PORT: 5001
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./ssl:/app/ssl:ro
    ports:
      - "5001:5001"
    depends_on:
      - db
      - vault
    # Nodemon already configured in package.json dev script
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Preview serves the built assets (see frontend Dockerfile).
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5173"]

  # Development services with hot-reload and source bind mounts
  backend-dev:
    image: node:24-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      HTTP_PORT: 5001
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
      - ./ssl:/app/ssl:ro
    ports:
      - "5002:5001" # expose on different host port to avoid clash with backend prod-like service
    depends_on:
      - db
      - vault
    command: ["sh", "-c", "if [ ! -d node_modules ]; then npm ci; fi; npm run dev"]
    profiles: [dev]

    # Optional healthcheck could be added later

  frontend-dev:
    image: node:24-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./ssl:/app/ssl:ro
    ports:
      - "5174:5173" # separate port for dev
    depends_on:
      - backend-dev
    command: ["sh", "-c", "if [ ! -d node_modules ]; then npm ci; fi; npm run dev -- --host 0.0.0.0"]
    profiles: [dev]

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:

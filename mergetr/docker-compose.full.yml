version: '3.8'

services:
  # Base de données PostgreSQL pour développement
  db:
    image: postgres:14
    container_name: ft_transcendence_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-db_transcendence}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/gdpr-schema.sql:/docker-entrypoint-initdb.d/02-gdpr-schema.sql
    networks:
      - app_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-db_transcendence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js/Fastify
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ft_transcendence_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-db_transcendence}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-12345}
      API_42_CLIENT_ID: ${API_42_CLIENT_ID:-}
      API_42_CLIENT_SECRET: ${API_42_CLIENT_SECRET:-}
      API_42_REDIRECT_URI: ${API_42_REDIRECT_URI:-http://localhost:5173/auth/callback}
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-token-12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SERVER_PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app_network_dev
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React/Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ft_transcendence_frontend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001/api}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5001}
      VITE_42_CLIENT_ID: ${API_42_CLIENT_ID:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network_dev
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer pour la gestion de la base de données (optionnel)
  adminer:
    image: adminer:4.8.1
    container_name: ft_transcendence_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app_network_dev
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  # HashiCorp Vault pour développement (optionnel)
  vault:
    image: hashicorp/vault:1.15
    container_name: ft_transcendence_vault_dev
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-token-12345}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
    ports:
      - "8200:8200"
    volumes:
      - vault_data_dev:/vault/data
    networks:
      - app_network_dev
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network_dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  vault_data_dev:
    driver: local

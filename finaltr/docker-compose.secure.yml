version: '3.8'

services:
  db:
    image: postgres:14
    container_name: ft_transcendence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./backend/src/db/gdpr-schema.sql:/docker-entrypoint-initdb.d/10-gdpr.sql:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: ft_transcendence_vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
    volumes:
      - vault_data:/vault/data
    networks:
      - app_network
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.secure
    container_name: ft_transcendence_app
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN}"
      JWT_SECRET: "${JWT_SECRET}"
      SALT_ROUNDS: "12"
      RESET_DB: "false"
      CLIENT_ID_42: "${CLIENT_ID_42}"
      CLIENT_SECRET_42: "${CLIENT_SECRET_42}"
      REDIRECT_URI: "https://localhost:8443/auth/42/callback"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_REDIRECT_URI: "https://localhost:8443/auth/github/callback"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "https://localhost:8443/auth/google/callback"
      FRONTEND_URL: "https://localhost:8443"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "587"
      MAIL_USER: "${MAIL_USER}"
      MAIL_PASS: "${MAIL_PASS}"
      ALLOWED_ORIGINS: "https://localhost:8443,https://127.0.0.1:8443,http://localhost:5173,http://127.0.0.1:5173,https://localhost,https://127.0.0.1"
      GDPR_DEBUG: "1"
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ssl:/etc/nginx/ssl
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  vault_data:
    driver: local



